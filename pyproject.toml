[project]
name = "musyric"
version = "0.1.0"
description = "A CLI tool to download full music albums using iTunes API and YouTube Music."
authors = [{name = "Your Name"}]
dependencies = [
    "yt-dlp",
    "mutagen",
    "typer",
    "rich",
    "thefuzz",
    "requests",
    "questionary",
]
readme = "README.md"
requires-python = ">= 3.9"

[project.scripts]
musyric = "musyric.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
